<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyFlow | Student Productivity Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h1>StudyFlow</h1>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Tasks</a>
            <a href="#">Notes</a>

            <button id="themeToggle">
                🌙 Dark Mode
            </button>
        </nav>

    </header>


    <main>

        <!-- Welcome -->
        <section class="welcome">

            <h2>Good morning 👋</h2>

            <p>Let's get things done.</p>

        </section>


 <!-- Statistics Section -->
<section class="stats">

    <div class="stat-card">

        <h3>Total Tasks</h3>

        <p id="totalTasks">0</p>

    </div>


    <div class="stat-card">

        <h3>Completed</h3>

        <p id="completedTasks">0</p>

    </div>


    <div class="stat-card">

        <h3>Progress</h3>

        <p id="progressPercentage">0%</p>

    </div>


    <div class="stat-card">

        <h3>Study Streak 🔥</h3>

        <p id="studyStreak">0 days</p>

    </div>

</section>

        <!-- Dashboard -->
        <section class="dashboard-grid">


<!-- Tasks Section -->
<div class="tasks">

    <h2>Today's Tasks</h2>

    <div class="task-input">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter a task..."
        >

        <input
            type="date"
            id="taskDueDate"
        >

        <button id="addTask">
            Add Task
        </button>

    </div>


    <div class="task-filters">

        <button class="filter-button active" data-filter="all">
            All
        </button>

        <button class="filter-button" data-filter="active">
            Active
        </button>

        <button class="filter-button" data-filter="completed">
            Completed
        </button>

    </div>


    <ul id="taskList"></ul>

</div>
            <!-- Pomodoro -->
            <div class="pomodoro">

                <h2>Pomodoro Timer</h2>

                <h3 id="timerMode">
                    Work Session
                </h3>

                <div id="timer">
                    25:00
                </div>

                <button id="startTimer">
                    Start
                </button>

                <button id="pauseTimer">
                    Pause
                </button>

                <button id="resetTimer">
                    Reset
                </button>

            </div>

        </section>


        <!-- Notes -->
        <section class="notes">

            <h2>Quick Notes</h2>

            <textarea
                id="notes"
                placeholder="Write something..."
            ></textarea>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
