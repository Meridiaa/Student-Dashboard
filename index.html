<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyFlow | Student Productivity Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h1>StudyFlow</h1>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Tasks</a>
            <a href="#">Notes</a>
        </nav>

    </header>


    <main>

        <!-- Welcome Section -->
        <section class="welcome">

            <h2>Good morning 👋</h2>

            <p>Let's get things done.</p>

        </section>


        <!-- Statistics Section -->
        <section class="stats">

            <div class="stat-card">

                <h3>Total Tasks</h3>

                <p id="totalTasks">0</p>

            </div>


            <div class="stat-card">

                <h3>Completed</h3>

                <p id="completedTasks">0</p>

            </div>


            <div class="stat-card">

                <h3>Progress</h3>

                <p id="progressPercentage">0%</p>

            </div>

        </section>


        <!-- Main Dashboard -->
        <section class="dashboard-grid">


            <!-- Tasks Section -->
            <div class="tasks">

                <h2>Today's Tasks</h2>


                <div class="task-input">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter a task..."
                    >

                    <button id="addTask">
                        Add Task
                    </button>

                </div>


                <ul id="taskList">

                    <li>
                        <span>Study DSA</span>
                        <button>Delete</button>
                    </li>

                    <li>
                        <span>Complete college work</span>
                        <button>Delete</button>
                    </li>

                    <li>
                        <span>Practice Java</span>
                        <button>Delete</button>
                    </li>

                </ul>

            </div>


 <!-- Pomodoro Section -->
<div class="pomodoro">

    <h2>Pomodoro Timer</h2>

    <h3 id="timerMode">Work Session</h3>

    <div id="timer">
        25:00
    </div>

    <button id="startTimer">
        Start
    </button>

    <button id="pauseTimer">
        Pause
    </button>

    <button id="resetTimer">
        Reset
    </button>

</div>

        <!-- Notes Section -->
        <section class="notes">

            <h2>Quick Notes</h2>

            <textarea
                id="notes"
                placeholder="Write something..."
            ></textarea>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
